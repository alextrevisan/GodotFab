# Groups the pull requests listed in the generated release notes by label.
changelog:
  exclude:
    labels: ["skip-changelog"]
  categories:
    - title: New features
      labels: ["feature", "enhancement"]
    - title: Exporter fixes
      labels: ["exporter"]
    - title: Bug fixes
      labels: ["bug", "fix"]
    - title: Documentation
      labels: ["documentation"]
    - title: Other changes
      labels: ["*"]
